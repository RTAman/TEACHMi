name: Backend

on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DB_PORT: '55464'
      GEMINI_ENABLED: 'false'
      GEMINI_API_KEY: ''
      GEMINI_MODEL: ''
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Start PostgreSQL
        run: |
          cp .env.example .env
          docker compose up -d --wait db
      - name: Verify runnable API request examples without network calls
        shell: pwsh
        run: ./api/Test-LearningRequest.ps1
      - name: Build and run PostgreSQL integration and OpenAPI contract tests
        run: ./gradlew --no-daemon build
      - name: Verify offline A B C HTTP journeys and restart recovery
        env:
          TEACHMI_OFFLINE_HTTP_TEST: 'true'
          DB_URL: jdbc:postgresql://127.0.0.1:55464/postgres
          DB_USER: teachmi
          DB_PASSWORD: teachmi_local_only
        run: ./gradlew --no-daemon offlineHttpTest
      - name: Validate deployment operator safety without starting containers
        run: python3 -m unittest discover -s deploy/tests -p test_ops.py -v

  deployment-package:
    needs: build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      GEMINI_ENABLED: 'false'
      GEMINI_API_KEY: ''
      TEACHMI_DEPLOY_TEST: 'true'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: docker/setup-buildx-action@v4
      - name: Package the already-tested source
        run: ./gradlew --no-daemon bootJar
      - name: Verify private containers, proxy, backup and new database restore
        env:
          # Both build and runtime checks use the runner's native architecture.
          DOCKER_DEFAULT_PLATFORM: linux/${{ matrix.arch }}
        run: python3 deploy/tests/container_smoke.py --arch ${{ matrix.arch }}
