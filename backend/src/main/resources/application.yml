spring:
  application:
    name: teachmi-backend
  config:
    import: optional:file:./.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:${DB_PORT:5433}/${DB_NAME:teachmi}}
    username: ${DB_USER:teachmi}
    password: ${DB_PASSWORD}
  flyway:
    default-schema: public
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.default_schema: teachmi

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
