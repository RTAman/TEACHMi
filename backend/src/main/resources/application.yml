spring:
  application:
    name: teachmi-backend
  config:
    import: optional:file:./.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:${DB_PORT:5433}/${DB_NAME:teachmi}}
    username: ${DB_USER:teachmi}
    password: ${DB_PASSWORD}
  flyway:
    default-schema: public
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.default_schema: teachmi

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health

teachmi:
  auth:
    cookie-name: ${AUTH_COOKIE_NAME:TEACHMI_SESSION}
    cookie-secure: ${AUTH_COOKIE_SECURE:true}
    cookie-same-site: ${AUTH_COOKIE_SAME_SITE:Lax}
    session-ttl: ${AUTH_SESSION_TTL:7d}
    login-max-failures: ${AUTH_LOGIN_MAX_FAILURES:5}
    login-failure-window: ${AUTH_LOGIN_FAILURE_WINDOW:15m}
  gemini:
    enabled: ${GEMINI_ENABLED:false}
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:}
    connect-timeout-seconds: ${GEMINI_CONNECT_TIMEOUT_SECONDS:3}
    request-timeout-seconds: ${GEMINI_REQUEST_TIMEOUT_SECONDS:20}
    requests-per-minute: ${GEMINI_REQUESTS_PER_MINUTE:10}
    requests-per-day: ${GEMINI_REQUESTS_PER_DAY:100}
    member-requests-per-day: ${GEMINI_MEMBER_REQUESTS_PER_DAY:20}
    max-attempts: ${GEMINI_MAX_ATTEMPTS:2}
    max-source-chars: ${GEMINI_MAX_SOURCE_CHARS:16000}
    max-output-tokens: ${GEMINI_MAX_OUTPUT_TOKENS:2048}
